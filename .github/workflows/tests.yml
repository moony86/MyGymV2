name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Verify a fresh database migration
        run: DB_PATH="$RUNNER_TEMP/mygym-migration-check.sqlite3" python -m alembic upgrade head
      - run: python -m pytest tests -q --disable-warnings
      - run: python -m pytest security_tests -q --disable-warnings
