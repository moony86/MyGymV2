version: 1.0

metadata:
  name: Movement Pattern Library
  description: >
    Defines every movement pattern recognized by the Gym Knowledge Engine.
    Exercises never exist independently.
    Every exercise must belong to exactly one primary movement pattern.

movement_patterns:

# ==========================================================
# UPPER BODY PUSH
# ==========================================================

- id: movement.horizontal_push

  name: Horizontal Push

  category: upper_body

  description: >
    Pressing movement away from the torso on a horizontal plane.

  primary_muscles:

    - muscle.chest.middle

  secondary_muscles:

    - muscle.front_delts
    - muscle.triceps

  exercise_role:

    primary

  movement_type:

    compound

  recommended_frequency:

    minimum: 2

# ----------------------------------------------------------

- id: movement.incline_push

  name: Incline Push

  category: upper_body

  description: >
    Pressing movement emphasizing the clavicular chest.

  primary_muscles:

    - muscle.chest.upper

  secondary_muscles:

    - muscle.front_delts
    - muscle.triceps

  movement_type:

    compound

  exercise_role:

    primary

# ----------------------------------------------------------

- id: movement.vertical_push

  name: Vertical Push

  category: upper_body

  description: >
    Overhead pressing movement.

  primary_muscles:

    - muscle.side_delts
    - muscle.front_delts

  secondary_muscles:

    - muscle.triceps
    - muscle.chest.upper

  movement_type:

    compound

  exercise_role:

    primary

# ==========================================================
# UPPER BODY PULL
# ==========================================================

- id: movement.vertical_pull

  name: Vertical Pull

  category: upper_body

  description: >
    Pulling movement from overhead.

  primary_muscles:

    - muscle.lats

  secondary_muscles:

    - muscle.biceps
    - muscle.upper_back
    - muscle.rear_delts

  movement_type:

    compound

  exercise_role:

    primary

# ----------------------------------------------------------

- id: movement.horizontal_pull

  name: Horizontal Pull

  category: upper_body

  description: >
    Horizontal rowing movement.

  primary_muscles:

    - muscle.upper_back

  secondary_muscles:

    - muscle.lats
    - muscle.biceps
    - muscle.rear_delts

  movement_type:

    compound

  exercise_role:

    primary

# ==========================================================
