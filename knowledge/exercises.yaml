version: 1.0

metadata:
  name: Exercise Library
  description: >
    Defines abstract exercises recognized by the Gym Knowledge Engine.

    This file does NOT contain equipment-specific implementations.

    Example

    Horizontal Press

    NOT

    Barbell Bench Press

exercises:

# ==========================================================
# CHEST
# ==========================================================

- id: exercise.horizontal_press

  name: Horizontal Press

  movement_pattern: movement.horizontal_push

  category: compound

  primary_muscles:

    - muscle.chest.middle

  secondary_muscles:

    - muscle.front_delts
    - muscle.triceps

  exercise_role: primary

  beginner_friendly: true

  unilateral: false

  estimated_time_minutes: 3

# ----------------------------------------------------------

- id: exercise.incline_press

  name: Incline Press

  movement_pattern: movement.incline_push

  category: compound

  primary_muscles:

    - muscle.chest.upper

  secondary_muscles:

    - muscle.front_delts
    - muscle.triceps

  exercise_role: primary

  beginner_friendly: true

  unilateral: false

  estimated_time_minutes: 3

# ----------------------------------------------------------

- id: exercise.chest_fly

  name: Chest Fly

  movement_pattern: movement.horizontal_push

  category: isolation

  primary_muscles:

    - muscle.chest.middle

  secondary_muscles: []

  exercise_role: accessory

  beginner_friendly: true

  unilateral: false

  estimated_time_minutes: 2

