<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الحسابات | MyGym</title><link rel="stylesheet" href="/static/auth.css?v=2"><script src="/static/auth.js?v=3"></script><script src="/static/accounts.js" defer></script></head><body class="auth-page"><main class="auth-card auth-wide"><p class="auth-label">MYGYM · إدارة العائلة</p><h1>لكل شخص مساحته.</h1><p>اربط الملفات الموجودة بحساباتها، أو أنشئ حسابًا جديدًا. حفظ كلمة مرور جديدة ينهي جلسات ذلك الحساب.</p><form id="accounts-form"><label>الملف الشخصي<select id="profile"><option value="">إنشاء شخص جديد</option></select></label><label id="name-label">اسم الشخص<input id="name" maxlength="80" required></label><label>اسم المستخدم<input id="username" autocomplete="off" maxlength="80" required></label><label>كلمة المرور الجديدة<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><small>12 حرفًا على الأقل. يمكن للشخص تغييرها بعد دخوله.</small></label><button id="submit" type="submit">حفظ الحساب</button><p id="message" role="status"></p></form><a href="/">العودة إلى MyGym</a></main></body></html>
