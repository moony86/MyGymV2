<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyGym Pro Core</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🏋️ MyGym</h1>
            <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                <label for="profile-selector">المستخدم:</label>
                <select id="profile-selector" style="flex:1; padding:8px;">
                    <option>جاري التحميل...</option>
                </select>
                <button class="btn-secondary" onclick="addProfile()" style="width:auto;">+ شخص</button>
            </div>
        </header>

        <main>
            <section class="card">
                <h2 id="workout-section-title">🚀 ابدأ تمرينًا جديدًا</h2>

                <button id="main-workout-btn" class="btn-primary btn-large" onclick="handleMainButtonClick(this)" style="transition: all 0.3s ease;">
                    ابدأ تمرينًا
                </button>
				<button class="btn-secondary" onclick="window.location.href='/plans'" style="margin-top: 12px; width: 100%;">
					📋 خططي التدريبية
				</button>

                <button id="abandon-shortcut-btn" class="btn-secondary" onclick="abandonActiveSession(this)" style="display: none; margin-top: 12px; width: 100%; background-color: #ef4444; color: white;">
                    🗑️ حذف وإلغاء الجلسة المعلقة
                </button>

                <button class="btn-secondary" onclick="toggleBodyTracking()" style="margin-top: 12px; width: 100%;">
                    📏 قياسات الجسم
                </button>
            </section>

            <section class="history-section">
                <h2>✓ آخر التمارين</h2>
                <div id="history-list">
                </div>
            </section>
        </main>
    </div>

    <!-- ====== MODAL لعرض تفاصيل الجلسة ====== -->
    <div id="history-modal" class="modal-overlay" style="display: none;" onclick="if(event.target===this) History.close()">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modal-session-title">جلسة</h2>
                <button class="modal-close-btn" onclick="History.close()">✕</button>
            </header>
            <div id="modal-session-meta" class="modal-meta">
                <span id="modal-session-date"></span>
                <span id="modal-session-duration"></span>
                <span id="modal-session-volume"></span>
            </div>
            <div id="modal-exercises-list" class="modal-exercises">
                <!-- سيتم ملؤها بواسطة JS -->
            </div>
                <button class="btn-danger" style="margin-top: 12px;" onclick="History.deleteCurrentSession()">🗑️ حذف الجلسة</button>
            <button class="btn-secondary modal-close-btn-bottom" onclick="History.close()">إغلاق</button>
        </div>
    </div>

    <!-- ====== قسم تتبع الجسم (مخفي افتراضيًا) ====== -->
    <div id="body-tracking-dashboard" style="display: none;">
        <div class="container">
            <header>
                <h1>📏 تتبع الجسم</h1>
            </header>
            <main>
                <section class="card">
                    <h2>آخر قياس</h2>
                    <div id="latest-measurement">
                        <p style="color: var(--text-secondary);">لا توجد قياسات بعد</p>
                    </div>
                </section>
                <section class="card" style="margin-top: 16px;">
                    <button class="btn-primary" onclick="window.location.href='/profile-setup#body-tracking'">
                        + إضافة قياس جديد
                    </button>
                    <button class="btn-secondary" onclick="window.location.href='/body-history'" style="margin-top: 8px; width: 100%;">
                        📋 سجل القياسات
                    </button>
                </section>
            </main>
        </div>
    </div>

    <div id="snackbar" class="snackbar"></div>

    <script src="/static/app.js?v=3"></script>
    <script>
    async function loadProfiles() {
        const selector = document.getElementById('profile-selector');
        try {
            const response = await fetch('/api/profiles');
            const profiles = await response.json();
            const current = localStorage.getItem('mygym_profile_id') || (profiles[0] && profiles[0].id);
            selector.innerHTML = profiles.map(profile =>
                `<option value="${profile.id}" ${profile.id === current ? 'selected' : ''}>${profile.name}</option>`
            ).join('');
            if (current && current !== localStorage.getItem('mygym_profile_id')) {
                localStorage.setItem('mygym_profile_id', current);
            }
        } catch (error) {
            selector.innerHTML = '<option>تعذر تحميل الملفات</option>';
        }
        selector.addEventListener('change', () => {
            localStorage.setItem('mygym_profile_id', selector.value);
            window.location.reload();
        });
    }

    async function addProfile() {
        const name = prompt('اسم الشخص');
        if (!name || !name.trim()) return;
        const response = await fetch('/api/profiles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim() }),
        });
        if (!response.ok) return;
        const profile = await response.json();
        localStorage.setItem('mygym_profile_id', profile.id);
        window.location.href = '/profile-setup';
    }

    loadProfiles();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js');
    }

    // ====== Onboarding Check ======
    (async function checkOnboarding() {
        const completed = localStorage.getItem('onboarding_completed');
        if (completed === 'true') {
            return;
        }
        try {
            const res = await fetch('/api/profile', {
                headers: localStorage.getItem('mygym_profile_id')
                    ? { 'X-Profile-Id': localStorage.getItem('mygym_profile_id') }
                    : {},
            });
            if (res.ok) {
                localStorage.setItem('onboarding_completed', 'true');
                return;
            }
            if (res.status === 404) {
                window.location.href = '/profile-setup';
                return;
            }
            console.warn('Profile check failed, continuing without redirect:', res.status);
        } catch (err) {
            console.warn('Profile check network error:', err);
        }
    })();
    </script>
</body>
</html>
