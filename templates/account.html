<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | MyGym</title><link rel="stylesheet" href="/static/auth.css?v=3"><script src="/static/auth.js?v=4"></script><script src="/static/account.js?v=2" defer></script></head><body class="auth-page"><main class="auth-card"><h1>حسابي</h1><section><h2>الدخول من هذا الجهاز</h2><p id="device-state">جاري التحقق…</p><button id="remember-device" type="button" hidden>تذكرني على هذا الجهاز</button><p id="device-message" role="status"></p></section><details><summary>تغيير كلمة المرور</summary><p>ينهي الجلسات الأخرى لحسابك.</p><form id="password-form"><label>كلمة المرور الحالية<input id="old-password" type="password" autocomplete="current-password" maxlength="128" required></label><label>كلمة المرور الجديدة<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button id="submit" type="submit">تغيير كلمة المرور</button><p id="message" role="status"></p></form></details><a href="/">العودة إلى MyGym</a></main></body></html>
